name: Fake Grass Farmer

on:
  schedule:
    # JST 00:15 = UTC 15:15
    # GitHub Actions is based on UTC by default.
    - cron: "15 15 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fake-grass-farmer
  cancel-in-progress: false

jobs:
  farm:
    name: Grow fake grass
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Fake Grass Farmer
        run: python farmer.py

      - name: Commit and push grass log
        run: |
          git config user.name "Saisei2004"
          git config user.email "zakaesosu1@gmail.com"

          git add data/fake_grass.log

          if git diff --cached --quiet; then
            echo "No fake grass to commit."
            exit 0
          fi

          git commit -m "grow fake grass 🌱"
          git push origin HEAD:${{ github.ref_name }}
