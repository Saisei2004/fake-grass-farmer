name: Fake Grass Farmer

on:
  schedule:
    # JST 00:15 = UTC 15:15
    # GitHub Actions is based on UTC by default.
    - cron: "15 15 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fake-grass-farmer
  cancel-in-progress: false

jobs:
  farm:
    name: Grow fake grass
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick commit count
        id: plan
        run: |
          count="$(python farmer.py --count)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Fake Grass Farmer will create $count commits."

      - name: Commit and push grass log
        if: steps.plan.outputs.count != '0'
        run: |
          git config user.name "Saisei2004"
          git config user.email "zakaesosu1@gmail.com"

          for i in $(seq 1 "${{ steps.plan.outputs.count }}"); do
            python farmer.py --entry-index "$i" --entry-total "${{ steps.plan.outputs.count }}"
            git add data/fake_grass.log

            if git diff --cached --quiet; then
              echo "No fake grass to commit for entry $i."
              continue
            fi

            git commit -m "grow fake grass 🌱 ($i/${{ steps.plan.outputs.count }})"
          done

          git push origin HEAD:${{ github.ref_name }}

      - name: Rest field
        if: steps.plan.outputs.count == '0'
        run: echo "No fake grass today."
